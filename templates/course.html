<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.title }} - Deaf Learning Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="container">
            <h1>{{ course.title }}</h1>
        </div>
    </header>

    <div class="container main-content">
        <h3>{{ course.description }}</h3>
        <ul>
        {% for lecture in course.lectures %}
            <li><a href="/lecture/{{ course._id }}/{{ lecture.id }}">{{ lecture.title }}</a></li>
        {% endfor %}
        </ul>
        <a href="/quiz/{{ course._id }}">Take Quiz</a>
    </div>

</body>
</html>
