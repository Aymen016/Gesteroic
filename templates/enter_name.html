<!DOCTYPE html>
<html>
<head>
    <title>Enter Your Name</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f2f2f2;
        }

        form {
            background: white;
            display: inline-block;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        input[type="text"] {
            padding: 10px;
            width: 250px;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        input[type="file"] {
            margin: 15px 0;
            padding: 10px;
            width: 250px;
            font-size: 1em;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 1em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <form method="POST"  enctype="multipart/form-data">
        <h2>Enter Your Name and Profile Picture</h2>
        <input type="hidden" name="score" value="{{ score }}">
        <input type="text" name="student_name" placeholder="Your Name" required>
        <br>
        <input type="file" name="profile_pic" accept="image/*" required>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
