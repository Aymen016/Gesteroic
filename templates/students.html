<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-admin.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #480636, #e46dcb);
            color: white;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .table {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            color: #333;
        }
        .table th {
            background-color: #0b0110;
            color: white;
        }
        .table td {
            background-color: #f9f9f9;
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f2f2f2;
        }
        .table thead th {
            text-align: center;
            padding: 15px;
        }
        .table tbody td {
            text-align: center;
            padding: 12px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Students and Their Courses</h2>
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Courses Enrolled</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                    <tr>
                        <td>{{ student.name }}</td>
                        <td>{{ student.courses }}</td> <!-- Assuming courses are stored in a list -->
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
