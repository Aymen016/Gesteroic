<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesteroic - Deaf Learning Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
        }

        .hero {
            position: relative;
            height: 100vh;
            background: url('{{ url_for('static', filename='images/gesteroic-logo.png') }}') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 114, 255, 0.6);
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            padding: 20px;
        }

        .hero-content img {
            width: 120px;
            margin-bottom: 20px;
        }

        .hero-content h1 {
            font-size: 3.2em;
            margin-bottom: 10px;
        }

        .hero-content p {
            font-size: 1.3em;
            margin-bottom: 30px;
        }

        .hero-content a {
            display: inline-block;
            margin: 0 10px;
            padding: 14px 28px;
            background-color: #fff;
            color: #0072ff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }

        .hero-content a:hover {
            background-color: #005ecc;
            color: white;
        }

        @media (max-width: 600px) {
            .hero-content h1 {
                font-size: 2em;
            }

            .hero-content p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <!-- Replace this src with your actual logo -->
            <img src="{{ url_for('static', filename='images/bg.jpg') }}" alt="Gesteroic Logo">
            <h1>Welcome to Gesteroic</h1>
            <p>Empowering the Deaf Community through Visual & Accessible Learning</p>
            <a href="/login">Login</a>
            <a href="/signup">Sign Up</a>
        </div>
    </section>

</body>
</html>
