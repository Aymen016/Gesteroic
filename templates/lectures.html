<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Lectures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Linear gradient background */
        body {
            background: linear-gradient(to right, #8560ad, #b9539e);
            color: #f1c40f;

            font-family: 'Arial', sans-serif;
        }

        h2 {
            text-align: center;
            margin-top: 50px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #f1c40f;
        }

        .lecture-item {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 15px 0;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }

        .lecture-item:hover {
            transform: translateY(-10px);
        }

        .lecture-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .course-name {
            color: #020707;
            font-style: italic;
            margin-top: 10px;
        }

        .lecture-description {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #ecf0f1;
        }

        .watch-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #6c1964;
            color: white;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .watch-button:hover {
            background-color: #562c08;
        }

        .container {
            padding: 20px;
        }

        .lecture-list {
            list-style-type: none;
            padding: 0;
        }

        .lecture-item + .lecture-item {
            margin-top: 30px;
        }

        .no-video {
            font-size: 1rem;
            color: #ecf0f1;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>All Video Lectures</h2>

        <ul class="lecture-list">
            {% for lecture in lectures %}
                <li class="lecture-item">
                    <div class="lecture-title">{{ lecture.title }}</div>
                    <div class="course-name">Course: {{ lecture.course_name }}</div>
                    <div class="lecture-description">{{ lecture.description }}</div>
                    
                </li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
