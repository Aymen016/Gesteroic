<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesteroic Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
            font-family: 'Poppins', sans-serif;
            color: white;
        }
        .card {
            border-radius: 20px;
            min-height: 200px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .btn-lg {
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        h1.text-center {
            margin: 40px 0;
            font-weight: bold;
            text-shadow: 2px 2px 5px #000;
        }
        .navbar-nav .nav-link {
        position: relative;
        transition: all 0.3s ease;
    }

    .navbar-nav .nav-link:hover {
        color: #f0f0f0;
        transform: scale(1.05);
    }

    .navbar-nav .nav-link::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -5px;
        width: 0%;
        height: 2px;
        background-color: #ffffff;
        transition: width 0.3s;
    }

    .navbar-nav .nav-link:hover::after {
        width: 100%;
    }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gesteroic Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/students">Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="/courses">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="/teachers">Teachers</a></li>
                    <li class="nav-item"><a class="nav-link" href="/lectures">Video Lessons</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <h1 class="text-center mb-5">Welcome, Admin</h1>
        <div class="row">
            <div class="col-md-3">
                <div class="card text-white" style="background-color: #6a11cb;">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Students</h5>
                        <h2>{{ total_students }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white" style="background-color: #11998e;">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Courses</h5>
                        <h2>{{ total_courses }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white" style="background-color: #ff6a00;">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Teachers</h5>
                        <h2>{{ total_teachers }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white" style="background-color: #ee0979;">
                    <div class="card-body text-center">
                        <h5 class="card-title">Video Lectures</h5>
                        <h2>{{ total_lectures }}</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="text-center mt-4">
            <a href="/add_course" class="btn btn-success btn-lg me-3">Add Course</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
