
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Lecture</title>
    <style>
        body {
            background-color: #f7e5e3;
            font-family: 'Arial', sans-serif;
            color: #222;
            padding: 40px;
        }

        h1 {
            color: #ff6b6b;
            text-align: center;
        }

        form {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #ff6b6b;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #ff6b6b;
            font-size: 16px;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #ff4040;
        }

        label {
            font-size: 18px;
            color: #ff6b6b;
            font-weight: bold;
        }

        input::placeholder, textarea::placeholder {
            color: #d2a1a1;
        }
    </style>
</head>
<body>

<h1>Add Lecture</h1>

<form action="/add_lecture/{{ course_id }}" method="POST">
    <label for="lecture_title">Lecture Title</label>
    <input type="text" id="lecture_title" name="lecture_title" placeholder="Enter Lecture Title" required>
    
    <label for="lecture_video_url">Lecture Video URL</label>
    <input type="text" id="lecture_video_url" name="lecture_video_url" placeholder="Enter YouTube URL" required>
    
    <label for="description">Lecture Description</label>
    <textarea id="description" name="description" placeholder="Enter Description" required></textarea>
    
    <button type="submit">Add Lecture</button>
</form>

</body>
</html>
