{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Register New Student</h2>
    <form action="/register_student" method="POST">

        <label for="student_id">Student ID:</label>
        <input type="text" id="student_id" name="student_id" required>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="roll_number">Roll Number:</label>
        <input type="text" id="roll_number" name="roll_number" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <label for="profile_picture">Profile Picture URL:</label>
        <input type="text" id="profile_picture" name="profile_picture">

        <label for="courses_enrolled">Courses Enrolled (comma-separated):</label>
        <input type="text" id="courses_enrolled" name="courses_enrolled">

        <label for="completed_courses">Completed Courses (comma-separated):</label>
        <input type="text" id="completed_courses" name="completed_courses">

        <label for="videos_watched">Videos Watched (comma-separated):</label>
        <input type="text" id="videos_watched" name="videos_watched">

        <label for="total_courses">Total Courses:</label>
        <input type="number" id="total_courses" name="total_courses" required>

        <label for="completed_courses">Completed Courses:</label>
        <input type="number" id="completed_courses" name="completed_courses" required>

        <label for="progress">Progress (%):</label>
        <input type="text" id="progress" name="progress" required>

        <button type="submit">Register Student</button>
    </form>
</div>

<style>
    .container {
        width: 50%;
        margin: 0 auto;
        padding: 20px;
        background: white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        border-radius: 10px;
    }

    form {
        display: flex;
        flex-direction: column;
    }

    label {
        margin-top: 10px;
        font-weight: bold;
    }

    input {
        padding: 8px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button {
        margin-top: 20px;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }
</style>

{% endblock %}
