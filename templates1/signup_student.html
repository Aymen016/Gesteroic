{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Student Signup</h2>

    <form method="POST" class="signup-form" oninput="updateProfilePic()">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="number" name="age" placeholder="Age" required>
        <input type="text" name="roll_number" placeholder="Roll Number" required>
        <input type="url" name="profile_picture" id="profile_picture" placeholder="Profile Picture URL" required>

        <div class="profile-preview">
            <img id="profile-pic-preview" src="" alt="Profile Preview">
        </div>

        <button type="submit" class="btn">Sign Up</button>
    </form>

    <p class="center">
        Already have an account? 
        <a href="{{ url_for('login_student') }}" class="link">Login here</a>
    </p>
</div>

<style>
    .form-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
    }

    .signup-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .signup-form input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
    }

    .profile-preview {
        display: flex;
        justify-content: center;
        margin-top: 10px;
    }

    #profile-pic-preview {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        display: none;
        border: 3px solid #007bff;
    }

    .btn {
        background: #007bff;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .btn:hover {
        background: #0056b3;
    }

    .link {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }

    .link:hover {
        text-decoration: underline;
    }
</style>

<script>
    function updateProfilePic() {
        let url = document.getElementById('profile_picture').value;
        let img = document.getElementById('profile-pic-preview');
        
        if (url) {
            img.src = url;
            img.style.display = "block";
        } else {
            img.style.display = "none";
        }
    }
</script>

{% endblock %}
