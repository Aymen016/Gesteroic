{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Student Login</h2>

    <form method="POST" class="login-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit" class="btn">Login</button>
    </form>

    <p class="center">
        Don't have an account? 
        <a href="{{ url_for('signup_student') }}" class="link">Sign Up here</a>
    </p>
</div>

<style>
    .form-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .login-form input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
    }

    .btn {
        background: #007bff;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .btn:hover {
        background: #0056b3;
    }

    .link {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }

    .link:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
