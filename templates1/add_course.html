<!-- add_course.html -->
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="title">Add New Course</h2>
    <form method="POST" action="/add-course">
        <label for="course_id">Course ID:</label>
        <input type="text" id="course_id" name="course_id" required>

        <label for="name">Course Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="professor">Professor Name:</label>
        <input type="text" id="professor" name="professor" required>

        <label for="students_enrolled">Students Enrolled:</label>
        <input type="number" id="students_enrolled" name="students_enrolled" required>

        <label for="credits">Credits:</label>
        <input type="number" id="credits" name="credits" required>

        <label for="duration">Duration:</label>
        <input type="text" id="duration" name="duration" required>

        <label for="description">Course Description:</label>
        <textarea id="description" name="description" required></textarea>

        <button type="submit">Add Course</button>
    </form>
</div>

<style>
    .container {
        width: 50%;
        margin: auto;
        padding: 20px;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        color: black;
        text-align: center;
    }
    .title {
        font-size: 2em;
        margin-bottom: 20px;
    }
    form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    label {
        margin-top: 10px;
        font-weight: bold;
    }
    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    button {
        margin-top: 20px;
        padding: 10px 20px;
        background: #ff6f61;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #d63a2f;
    }
</style>
{% endblock %}
